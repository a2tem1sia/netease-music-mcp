name: 问题反馈 / Bug report
description: 某个工具报错、结果不对，或者安装不上
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **请不要粘贴 Cookie、`MUSIC_U` 或任何登录凭证。** 错误信息里如果包含这些内容，请先删掉。
  - type: dropdown
    id: client
    attributes:
      label: 使用方式
      options:
        - Claude Desktop（.mcpb 扩展）
        - Claude Desktop（手动配置）
        - Claude Code
        - claude.ai 远程连接器（HTTP 模式）
        - 其它
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 连接器版本
      placeholder: 例如 0.1.0（见 manifest.json 或 package.json）
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: 出问题的工具
      placeholder: 例如 search、get_daily_recommendations、login_qr_check
  - type: dropdown
    id: login
    attributes:
      label: 是否已登录
      options:
        - 未登录
        - 扫码登录
        - Cookie 登录
  - type: dropdown
    id: network
    attributes:
      label: 网络环境
      options:
        - 中国大陆
        - 境外 / 海外服务器
        - 不确定
  - type: input
    id: env
    attributes:
      label: 操作系统和 Node.js 版本
      placeholder: 例如 macOS 15，Node 22.12
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 你让 Claude 做了什么、实际结果是什么、期望的结果是什么
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: 错误信息
      description: 工具返回的错误文字，或者 `npm run test:live` 的输出（同样请去掉 Cookie）
      render: text
